# pBLAKE3 on the 6 platforms of PJA: the official vectors, on the C path and the Pascal path.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc clang
      - run: CC=clang sh build.sh && CC=clang sh lib.sh && CC=clang sh lib_c.sh
      - name: b3sum against the official one (cargo install b3sum)
        run: cargo install b3sum --locked && B3OFF=$HOME/.cargo/bin/b3sum sh tests/diff_b3sum.sh
      - name: both libraries against the official Python binding (every size 0..20000, boundaries, XOF, pieces)
        run: pip install blake3 && python3 tests/py_diff.py build/libpblake3.so build/libpblake3c.so --max 20000 --random 300
      - name: the C code under AddressSanitizer and UBSan
        run: CC=gcc sh tests/sanitize.sh && CC=clang sh tests/sanitize.sh
  # the plain C core on other CPUs under qemu-user: aarch64 and ARM 32-bit (cross libc), big-endian powerpc64 and s390x (no libc)
  qemu-c-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm qemu-user binutils-powerpc64-linux-gnu binutils-s390x-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross
      - run: REQUIRE_ALL=1 sh tests/qemu_c_core.sh
  # the plain C implementation with Microsoft's compiler (what a 7-Zip plugin is often built with)
  msvc:
    strategy:
      matrix:
        arch: [x64, x86]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - shell: cmd
        run: |
          mkdir build
          cl /nologo /O2 /W3 /LD /DPBLAKE3_BUILD_DLL src\pblake3.c /Fe:build\pblake3m.dll /Fo:build\ || exit /b 1
          cl /nologo /O2 /W3 tests\api_test.c /Fe:build\api_test_m.exe /Fo:build\ || exit /b 1
          build\api_test_m.exe build\pblake3m.dll tests\official_hash.txt || exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS tests\static_test.c /Fe:build\static_test_m.exe /Fo:build\ || exit /b 1
          build\static_test_m.exe tests\official_hash.txt || exit /b 1
          cl /nologo /O2 /W3 /c src\b3chunks.c /Fo:build\bc.obj || exit /b 1
          cl /nologo /O2 /W3 /c /DB3_PLAIN /Dpblake3_chunks=pblake3_chunks_plain /Dpblake3_chunks_level=pblake3_chunks_level_plain /Dpblake3_chunks_kf=pblake3_chunks_kf_plain src\b3chunks.c /Fo:build\bp.obj || exit /b 1
          cl /nologo /O2 /W3 tests\chunks_diff.c build\bc.obj build\bp.obj /Fe:build\chunks_diff_m.exe /Fo:build\ || exit /b 1
          build\chunks_diff_m.exe || exit /b 1
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc clang
      - run: CC=clang sh build.sh && CC=clang sh lib.sh && CC=clang sh lib_c.sh
      - name: b3sum against the official one (cargo install b3sum)
        run: cargo install b3sum --locked && B3OFF=$HOME/.cargo/bin/b3sum sh tests/diff_b3sum.sh
  linux-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 gcc-multilib clang
      - run: scripts/fpc-i386.sh /tmp/fpc-i386
      - run: FPC=/tmp/fpc-i386/fpc CC="clang -m32" sh build.sh && FPC=/tmp/fpc-i386/fpc CC="clang -m32" sh lib.sh && CC="clang -m32" sh lib_c.sh
  # big-endian: PowerPC64 under qemu-user, with a cross FreePascal built from the distribution's source
  linux-ppc64-bigendian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc fpc-source clang llvm qemu-user binutils-powerpc64-linux-gnu
      - run: scripts/fpc-ppc64be.sh /tmp/fpc-ppc64
      - run: FPC=/tmp/fpc-ppc64/fpc CC="clang --target=powerpc64-linux-gnu -ffreestanding" NM=llvm-nm RUN=qemu-ppc64 sh build.sh
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install fpc
      - run: sh build.sh && sh lib.sh && sh lib_c.sh
      - name: b3sum against the official one (cargo install b3sum)
        run: cargo install b3sum --locked && B3OFF=$HOME/.cargo/bin/b3sum sh tests/diff_b3sum.sh
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal (win32 and win64)
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download'
          curl.exe -L --fail --retry 3 -o "$env:TEMP\fpc-setup.exe" $url
          Start-Process -Wait -FilePath "$env:TEMP\fpc-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          $fpc = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe | Select-Object -First 1
          if (-not $fpc) { throw 'fpc.exe not found after the installer' }
          Split-Path $fpc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
      - run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-clang
        shell: pwsh
      - shell: bash
        env:
          FPC: fpc -Px86_64
          CC: /c/msys64/mingw64/bin/clang
        run: sh build.sh && sh lib.sh && sh lib_c.sh
      - name: b3sum against the official one (cargo install b3sum)
        shell: bash
        run: cargo install b3sum --locked && B3OURS=build/b3sum.exe B3OFF=$HOME/.cargo/bin/b3sum.exe sh tests/diff_b3sum.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dll-windows-x64
          path: |
            build/pblake3.dll
            build/pblake3c.dll
            build/api_test_c.exe
            build/cross_impl.exe
            build/api_test.exe
            build/dll_pascal.exe
            build/b3sum.exe
            build/fuzz_split.exe
            build/chunks_diff.exe
            tests/official_hash.txt
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal (win32 and win64)
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download'
          curl.exe -L --fail --retry 3 -o "$env:TEMP\fpc-setup.exe" $url
          Start-Process -Wait -FilePath "$env:TEMP\fpc-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          $fpc = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe | Select-Object -First 1
          if (-not $fpc) { throw 'fpc.exe not found after the installer' }
          Split-Path $fpc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
      - run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-i686-gcc
        shell: pwsh
      - shell: bash
        env:
          FPC: fpc -Pi386
          CC: /c/msys64/mingw32/bin/gcc
        run: sh build.sh && sh lib.sh && sh lib_c.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dll-windows-x86
          path: |
            build/pblake3.dll
            build/pblake3c.dll
            build/api_test_c.exe
            build/cross_impl.exe
            build/api_test.exe
            build/dll_pascal.exe
            build/b3sum.exe
            build/fuzz_split.exe
            build/chunks_diff.exe
            tests/official_hash.txt
